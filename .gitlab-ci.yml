stages:
    - build
    - static-scanning
    - dynamic-scanning

cache:
  key:
    files:
      - composer.lock
  paths:
    - vendor/
    - ~/.composer/cache

build_job:
    stage: build
    image: php:8.3
    tags:
        - docker
    script:
        - apt-get update -yqq
        - apt-get install -yqq unzip libzip-dev
        - docker-php-ext-install zip
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        - composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
    artifacts:
        paths:
            - vendor/
        expire_in: 1 hour

build_assets:
  stage: build
  image: node:18-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - ~/.npm
  tags:
    - docker
  script:
    - npm ci
    - npm run prod
  artifacts:
    paths:
      - public/css/
      - public/js/
      - public/mix-manifest.json
    expire_in: 1 hour

