stages:
    - build
    - static-scanning

build_job:
    stage: build
    image: php:8.3
    tags:
        - docker
    script:
        - apt-get update -yqq
        - apt-get install -yqq unzip libzip-dev
        - docker-php-ext-install zip
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        - composer install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-reqs
    artifacts:
        paths:
            - vendor/
        expire_in: 1 hour

static-scanning-lint:
    stage: static-scanning
    image: php:8.3
    needs: [build_job]
    tags:
        - docker
    script:
        - find app config routes database tests bootstrap
            -name "*.php"
            -not -path "*/vendor/*"
            -not -path "*/node_modules/*"
            -print0 | xargs -0 -n1 -P$(nproc) php -l
    allow_failure: false

static-scanning-composer-audit:
    stage: static-scanning
    image: composer:2
    needs: [build_job]
    tags:
        - docker
    script:
        - set -o pipefail
        - composer audit --locked --format=json | tee composer-audit-report.json
    artifacts:
        paths:
            - composer-audit-report.json
        expire_in: 1 week
        when: always
    allow_failure: false

static-scanning-larastan:
    stage: static-scanning
    image: php:8.3
    needs: [build_job]
    tags:
        - docker
    script:
        - apt-get update -yqq
        - apt-get install -yqq unzip libzip-dev libpq-dev
        - docker-php-ext-install zip pdo pdo_mysql
        - cp .env.ci .env
        - ./vendor/bin/phpstan analyse --no-progress
    allow_failure: false