stages:
    - build
    - static-scanning

build_job:
    stage: build
    image: php:8.3
    tags:
        - docker
    before_script:
        - apt-get update -yqq
        - apt-get install -yqq git unzip libzip-dev zip
        - docker-php-ext-install zip
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        - composer install --no-interaction --prefer-dist --no-progress --no-scripts
    artifacts:
        paths:
            - vendor/
        expire_in: 1 hour

static-scanning-lint:
    stage: static-scanning
    image: php:8.3
    needs: [build_job]
    tags:
        - docker
    script:
        - find app config routes database tests bootstrap
            -name "*.php"
            -not -path "*/vendor/*"
            -not -path "*/node_modules/*"
            -print0 | xargs -0 -n1 -P$(nproc) php -l
    allow_failure: false
    