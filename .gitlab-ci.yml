stages:
    - build
    - static-scanning
    - dynamic-scanning

build_job:
    stage: build
    image: php:8.3
    tags:
        - docker
    script:
        - apt-get update -yqq
        - apt-get install -yqq unzip libzip-dev
        - docker-php-ext-install zip
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        - composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs
    artifacts:
        paths:
            - vendor/
        expire_in: 1 hour

static-scanning-lint:
    stage: static-scanning
    image: php:8.3
    needs: [build_job]
    tags:
        - docker
    script:
        - find app config routes database tests bootstrap
            -name "*.php"
            -not -path "*/vendor/*"
            -not -path "*/node_modules/*"
            -print0 | xargs -0 -n1 -P$(nproc) php -l
    allow_failure: false

static-scanning-composer-audit:
    stage: static-scanning
    image: composer:2
    needs: [build_job]
    tags:
        - docker
    script:
        - set -o pipefail
        - composer audit --locked --format=json | tee composer-audit-report.json
    artifacts:
        paths:
            - composer-audit-report.json
        expire_in: 1 week
        when: always
    allow_failure: false

static-scanning-larastan:
    stage: static-scanning
    image: php:8.3
    needs: [build_job]
    tags:
        - docker
    script:
        - apt-get update -yqq
        - apt-get install -yqq libpq-dev
        - docker-php-ext-install pdo pdo_mysql
        - cp .env.ci .env
        - ./vendor/bin/phpstan analyse --no-progress --configuration=phpstan.neon.dist --memory-limit=512M
    allow_failure: false

dynamic-scanning-zap:
    stage: dynamic-scanning
    image: php:8.3
    needs: [build_job]
    tags:
      - docker
  
    variables:
      MYSQL_DATABASE: lh_ehr
      MYSQL_ROOT_PASSWORD: passw0rd
      DB_HOST: db
      DB_CONNECTION: mysql
      APP_ENV: testing
      APP_DEBUG: "true"
  
    services:
      - name: mysql:8.0
        alias: db
  
    script:
      - apt-get update -yqq
      - apt-get install -yqq unzip libzip-dev wget default-jre-headless
      - docker-php-ext-install zip pdo pdo_mysql
  
      - cp .env.ci .env
      - php artisan key:generate --force
  
      - php -r "while(!@fsockopen('db', 3306)){sleep(1);}"
      - php artisan migrate --force
      - php artisan db:seed --class=ZapSeeder --force
  
      - php artisan serve --host=127.0.0.1 --port=8000 &
      - php -r "while(!@fsockopen('127.0.0.1', 8000)){sleep(1);}"
  
      - wget -q https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Crossplatform.zip
      - echo "94c8f767b1c2e94f0db66b3ae56514d5e3f5a728ee1b6c798e0c8fe2d61fbff0  ZAP_2.17.0_Crossplatform.zip" | sha256sum -c -
      - unzip -q ZAP_2.17.0_Crossplatform.zip
      - ./ZAP_2.17.0/zap.sh -cmd -autorun zap-plan.yaml
  
    artifacts:
      paths:
        - zap_report.json
        - zap_report.html
      expire_in: 1 week
      when: always
  
    allow_failure: true